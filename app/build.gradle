plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opengym.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.opengym.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // A fixed key, so every build is signed the same way and new APKs
    // install over the old one (your data is kept).
    signingConfigs {
        fixed {
            storeFile file('opengym.keystore')
            storePassword 'opengym'
            keyAlias 'opengym'
            keyPassword 'opengym'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
